<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exalted Chess</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #10151c;
      color: #f4f0e6;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 22px 8%;
      border-bottom: 1px solid #303944;
      color: #e2bd69;
      font-size: 24px;
      font-weight: bold;
    }

    main {
      width: min(900px, 88%);
      margin: 100px auto;
      text-align: center;
    }

    h1 {
      margin-bottom: 12px;
      font-size: clamp(42px, 8vw, 76px);
    }

    p {
      color: #b8c0cb;
      font-size: 18px;
      line-height: 1.6;
    }

    .panel {
      margin: 40px auto;
      padding: 28px;
      max-width: 600px;
      border: 1px solid #394553;
      border-radius: 16px;
      background: #19212b;
    }

    .button {
      display: inline-block;
      margin-top: 12px;
      padding: 14px 24px;
      border-radius: 9px;
      background: #d6ad58;
      color: #15191f;
      font-weight: bold;
      text-decoration: none;
    }

    .button:hover { background: #ebc873; }
  </style>
</head>
<body>
  <header>♟ Exalted Chess</header>

  <main>
    <h1>Play with purpose.</h1>
    <p>A new chess experience is being built here.</p>

    <section class="panel">
      <h2>The board is coming</h2>
      <p>This is the first version of the Exalted Chess website. Next, we’ll build the chessboard and game features.</p>
    </section>
  </main>
</body>
</html>
